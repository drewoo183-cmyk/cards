<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Арена Эфира CCG</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { user-select: none; -webkit-tap-highlight-color: transparent; }
    .card-taunt { border-color: #cbd5e1 !important; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
    .glow-green { box-shadow: 0 0 10px #22c55e; }
    .glow-yellow { box-shadow: 0 0 12px #eab308; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col font-sans overflow-hidden">

  <!-- ВЕРХНЯЯ ШАПКА -->
  <header class="p-3 bg-slate-900 border-b border-slate-800 flex justify-between items-center z-10">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center font-bold text-xs">⚔️</div>
      <span id="userName" class="font-bold text-sm">Игрок</span>
    </div>
    <div class="flex items-center space-x-3">
      <div class="flex items-center bg-slate-950 px-3 py-1 rounded-full border border-amber-500/30">
        <span class="text-amber-400 font-extrabold text-sm mr-1" id="balanceText">200</span>
        <span class="text-xs">🪙</span>
      </div>
      <button onclick="addCoins()" class="text-xs bg-amber-500/20 text-amber-300 px-2 py-1 rounded-lg">➕</button>
    </div>
  </header>

  <!-- ПЕРЕКЛЮЧАТЕЛЬ ВКЛАДОК -->
  <nav class="flex bg-slate-900 border-b border-slate-800 text-xs font-bold">
    <button onclick="switchTab('lobbyTab')" id="tabBtnLobby" class="flex-1 py-3 border-b-2 border-amber-500 text-amber-400">ДУЭЛИ</button>
    <button onclick="switchTab('deckTab')" id="tabBtnDeck" class="flex-1 py-3 border-b-2 border-transparent text-slate-400">МОЯ КОЛОДА (<span id="deckCountBadge">15/15</span>)</button>
  </nav>

  <!-- ВКЛАДКА 1: ЛОББИ ДУЭЛЕЙ -->
  <div id="lobbyTab" class="flex-1 flex flex-col p-4 overflow-y-auto space-y-3">
    <div class="grid grid-cols-2 gap-3">
      <button onclick="startPvE()" class="bg-gradient-to-br from-indigo-600 to-purple-800 p-3.5 rounded-2xl flex flex-col justify-between shadow-lg active:scale-95 text-left">
        <span class="text-2xl">🤖</span>
        <div>
          <h3 class="font-bold text-sm mt-1">Обучение</h3>
          <p class="text-[11px] text-indigo-200">Тренировка стола</p>
        </div>
      </button>

      <button onclick="openCreateRoomModal()" class="bg-gradient-to-br from-emerald-600 to-teal-800 p-3.5 rounded-2xl flex flex-col justify-between shadow-lg active:scale-95 text-left">
        <span class="text-2xl">➕</span>
        <div>
          <h3 class="font-bold text-sm mt-1">Создать дуэль</h3>
          <p class="text-[11px] text-emerald-200">Ставка монетами</p>
        </div>
      </button>
    </div>

    <div class="flex justify-between items-center pt-2">
      <h2 class="font-bold text-slate-400 text-xs tracking-wider uppercase">Комнаты дуэлей</h2>
      <button onclick="refreshLobby()" class="text-xs text-slate-400 hover:text-white">🔄 Обновить</button>
    </div>

    <div id="roomList" class="flex-1 space-y-2 overflow-y-auto">
      <div class="text-center py-10 text-slate-500 text-xs">Подключение к арене...</div>
    </div>
  </div>

  <!-- ВКЛАДКА 2: МОЯ КОЛОДА (ДЕКБИЛДЕР) -->
  <div id="deckTab" class="hidden flex-1 flex flex-col p-3 overflow-hidden">
    <div class="flex justify-between items-center pb-2">
      <div>
        <h3 class="text-sm font-bold text-white">Составление колоды</h3>
        <p class="text-[11px] text-slate-400">Нужно ровно 15 карт для участия</p>
      </div>
      <button onclick="saveDeck()" class="px-3 py-1.5 bg-emerald-500 text-slate-950 font-black text-xs rounded-xl shadow">Сохранить</button>
    </div>

    <!-- Фильтр по мане -->
    <div class="flex gap-1 overflow-x-auto py-1 text-xs">
      <button onclick="filterMana('all')" class="px-2.5 py-1 bg-slate-800 rounded-lg text-slate-300 font-bold">Все</button>
      <button onclick="filterMana(1)" class="px-2.5 py-1 bg-slate-800 rounded-lg font-bold">1 💎</button>
      <button onclick="filterMana(2)" class="px-2.5 py-1 bg-slate-800 rounded-lg font-bold">2 💎</button>
      <button onclick="filterMana(3)" class="px-2.5 py-1 bg-slate-800 rounded-lg font-bold">3 💎</button>
      <button onclick="filterMana(4)" class="px-2.5 py-1 bg-slate-800 rounded-lg font-bold">4 💎</button>
      <button onclick="filterMana(5)" class="px-2.5 py-1 bg-slate-800 rounded-lg font-bold">5+ 💎</button>
    </div>

    <!-- Сетка коллекции всех 80 карт -->
    <div id="collectionGrid" class="flex-1 overflow-y-auto grid grid-cols-3 gap-2 py-2 pr-1"></div>
  </div>

  <!-- ЭКРАН СТОЛА МАТЧА (HEARTHSTONE ARENA) -->
  <div id="battleArena" class="hidden fixed inset-0 bg-slate-950 z-30 flex flex-col justify-between p-2">
    <!-- Оппонент: Герой и Мана -->
    <div class="flex items-center justify-between bg-slate-900/90 p-2 rounded-2xl border border-slate-800">
      <div onclick="targetOppHero()" id="oppHeroBox" class="flex items-center space-x-2 cursor-pointer p-1 rounded-xl">
        <div class="relative">
          <div class="w-12 h-12 rounded-full bg-red-900/50 border-2 border-red-500 flex items-center justify-center text-xl">🥷</div>
          <span id="oppHpBadge" class="absolute -bottom-1 -right-1 bg-red-600 text-[11px] font-black px-1.5 py-0.5 rounded-full">25</span>
        </div>
        <div>
          <div id="battleOppName" class="font-bold text-xs">Враг</div>
          <div class="text-[10px] text-slate-400">Карт: <span id="oppHandCount">3</span></div>
        </div>
      </div>
      <!-- Кристаллы маны оппонента -->
      <div class="flex items-center space-x-1 text-cyan-400 font-bold text-xs bg-slate-950 px-2.5 py-1 rounded-full border border-cyan-500/30">
        <span>💎</span><span id="oppManaText">1/1</span>
      </div>
    </div>

    <!-- Стол оппонента (макс 4 существа) -->
    <div id="oppBoard" class="h-24 flex justify-center items-center gap-2 border-b border-dashed border-slate-800/80 my-1"></div>

    <!-- Стол игрока (макс 4 существа) -->
    <div id="myBoard" class="h-24 flex justify-center items-center gap-2 border-t border-dashed border-slate-800/80 my-1"></div>

    <!-- Панель игрока: Герой, Мана, Кнопка конца хода -->
    <div class="flex items-center justify-between bg-slate-900/90 p-2 rounded-2xl border border-slate-800">
      <div onclick="targetMyHero()" id="myHeroBox" class="flex items-center space-x-2 cursor-pointer p-1 rounded-xl">
        <div class="relative">
          <div class="w-12 h-12 rounded-full bg-emerald-900/50 border-2 border-emerald-500 flex items-center justify-center text-xl">🧙</div>
          <span id="myHpBadge" class="absolute -bottom-1 -right-1 bg-red-600 text-[11px] font-black px-1.5 py-0.5 rounded-full">25</span>
        </div>
        <div>
          <div class="font-bold text-xs" id="myBattleName">Вы</div>
          <div class="flex items-center space-x-1 text-cyan-400 font-bold text-xs">
            <span>💎</span><span id="myManaText">1/1</span>
          </div>
        </div>
      </div>

      <button id="endTurnBtn" onclick="endTurn()" class="px-5 py-2.5 bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-black text-xs rounded-xl shadow-lg active:scale-95 transition">
        Конец хода
      </button>
    </div>

    <!-- Рука игрока -->
    <div id="myHand" class="h-28 flex items-center gap-1.5 overflow-x-auto py-1 px-1 bg-slate-900/50 rounded-2xl border border-slate-800/60"></div>
  </div>

  <!-- МОДАЛКА СОЗДАНИЯ КОМНАТЫ СО СТАВКОЙ -->
  <div id="createRoomModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-40 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 w-full max-w-sm space-y-4">
      <h3 class="text-base font-bold text-center">Создание дуэли</h3>
      <div>
        <div class="flex justify-between text-xs font-bold mb-1">
          <span class="text-slate-400">Ставка:</span>
          <span class="text-amber-400"><span id="betDisplay">50</span> 🪙</span>
        </div>
        <input type="range" id="betSlider" min="10" max="200" step="10" value="50" oninput="updateBet(this.value)" class="w-full accent-amber-500 bg-slate-950 rounded-lg h-2 cursor-pointer">
      </div>
      <div class="flex gap-2">
        <button onclick="toggleModal('createRoomModal', false)" class="flex-1 py-2 bg-slate-800 rounded-xl text-xs font-bold">Отмена</button>
        <button onclick="confirmCreateRoom()" class="flex-1 py-2 bg-gradient-to-r from-amber-500 to-red-500 rounded-xl text-xs font-bold text-slate-950">Создать</button>
      </div>
    </div>
  </div>

  <script src="cardsData.js"></script>
  <script>
    // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ С RENDER:
    const SERVER_URL = "https://cards-server-xxxx.onrender.com";

    let tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let socket = null;
    let balance = Number(localStorage.getItem('cards_balance')) || 200;
    let playerName = tg?.initDataUnsafe?.user?.first_name || localStorage.getItem('cards_name') || 'Игрок 1';
    let currentRoomId = null;
    let currentBet = 50;

    // Пользовательская колода (15 карт)
    const defaultDeck = ['c1_1', 'c1_2', 'c1_3', 'c1_4', 'c2_1', 'c2_2', 'c2_4', 'c3_1', 'c3_2', 'c3_4', 'c4_1', 'c4_3', 'c5_1', 'c6_1', 'c8_1'];
    let myDeck = JSON.parse(localStorage.getItem('cards_my_deck')) || defaultDeck;

    // Состояние матча
    let gameState = null;
    let selectedHandCard = null;
    let selectedBoardMinion = null;

    document.getElementById('userName').innerText = playerName;
    updateBalanceDisplay();
    updateDeckBadge();
    renderCollection('all');

    try {
      socket = io(SERVER_URL, { transports: ['websocket'], timeout: 3000 });
      socket.on('connect', () => socket.emit('get_lobby'));
      socket.on('lobby_update', renderRoomList);
      socket.on('room_created', ({ roomId }) => { currentRoomId = roomId; renderWaitingState(); });
      socket.on('sync_state', (state) => handleServerSync(state));
      socket.on('game_over', (res) => handleGameOver(res));
      socket.on('connect_error', () => {
        document.getElementById('roomList').innerHTML = `<div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-center text-xs text-amber-400">Сервер временно оффлайн.</div>`;
      });
    } catch(e) { console.warn("Socket offline"); }

    function updateBalanceDisplay() {
      document.getElementById('balanceText').innerText = balance;
      localStorage.setItem('cards_balance', balance);
      const slider = document.getElementById('betSlider');
      if (slider) slider.max = Math.max(balance, 10);
    }

    function addCoins() { balance += 100; updateBalanceDisplay(); }
    function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }

    function switchTab(tabId) {
      document.getElementById('lobbyTab').classList.toggle('hidden', tabId !== 'lobbyTab');
      document.getElementById('deckTab').classList.toggle('hidden', tabId !== 'deckTab');
      document.getElementById('tabBtnLobby').className = tabId === 'lobbyTab' ? "flex-1 py-3 border-b-2 border-amber-500 text-amber-400" : "flex-1 py-3 border-b-2 border-transparent text-slate-400";
      document.getElementById('tabBtnDeck').className = tabId === 'deckTab' ? "flex-1 py-3 border-b-2 border-amber-500 text-amber-400" : "flex-1 py-3 border-b-2 border-transparent text-slate-400";
    }

    // --- ЛОГИКА ДЕКБИЛДЕРА (80 КАРТ) ---
    function updateDeckBadge() {
      document.getElementById('deckCountBadge').innerText = `${myDeck.length}/15`;
    }

    function filterMana(mana) {
      renderCollection(mana);
    }

    function renderCollection(filter) {
      const grid = document.getElementById('collectionGrid');
      if (typeof CARDS_DATABASE === 'undefined') return;

      const filtered = CARDS_DATABASE.filter(c => {
        if (filter === 'all') return true;
        if (filter === 5) return c.mana >= 5;
        return c.mana === filter;
      });

      grid.innerHTML = filtered.map(card => {
        const inDeck = myDeck.includes(card.id);
        return `
          <div onclick="toggleCardInDeck('${card.id}')" class="relative rounded-xl border ${inDeck ? 'border-amber-400 bg-amber-950/20' : 'border-slate-800 bg-slate-900'} p-2 flex flex-col justify-between h-32 active:scale-95 transition cursor-pointer">
            <div class="flex justify-between items-center">
              <span class="w-5 h-5 rounded-full bg-cyan-600 text-white font-black text-[10px] flex items-center justify-center">${card.mana}</span>
              <span class="text-lg">${card.icon}</span>
            </div>
            <div class="text-[10px] font-bold text-center leading-tight truncate">${card.name}</div>
            <div class="text-[8px] text-slate-400 text-center leading-none">${card.desc}</div>
            ${card.type === 'minion' ? `
              <div class="flex justify-between text-[10px] font-black pt-1">
                <span class="text-amber-400">⚔️${card.atk}</span>
                <span class="text-red-400">❤️${card.hp}</span>
              </div>` : `
              <div class="text-[9px] text-center font-bold text-indigo-400">Заклинание</div>`
            }
            ${inDeck ? `<div class="absolute top-1 right-1 text-xs">✅</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleCardInDeck(cardId) {
      const idx = myDeck.indexOf(cardId);
      if (idx !== -1) {
        myDeck.splice(idx, 1);
      } else {
        if (myDeck.length >= 15) return alert('Колода может содержать максимум 15 карт!');
        myDeck.push(cardId);
      }
      updateDeckBadge();
      renderCollection('all');
    }

    function saveDeck() {
      if (myDeck.length !== 15) return alert('В колоде должно быть ровно 15 карт!');
      localStorage.setItem('cards_my_deck', JSON.stringify(myDeck));
      alert('Колода успешно сохранена!');
    }

    // --- ЛОББИ КОМНАТ ---
    function updateBet(v) {
      currentBet = Number(v);
      document.getElementById('betDisplay').innerText = v;
    }

    function openCreateRoomModal() {
      if (myDeck.length !== 15) return alert('Сначала соберите колоду из 15 карт во вкладке "Моя колода"!');
      if (balance < 10) return alert('Недостаточно монет!');
      toggleModal('createRoomModal', true);
    }

    function confirmCreateRoom() {
      if (balance < currentBet) return alert('Недостаточно монет!');
      toggleModal('createRoomModal', false);
      if (socket?.connected) {
        socket.emit('create_room', { bet: currentBet, hostName: playerName, deck: myDeck });
      }
    }

    function renderRoomList(rooms) {
      const c = document.getElementById('roomList');
      if (!rooms || rooms.length === 0) {
        c.innerHTML = `<div class="text-center py-8 bg-slate-900/40 border border-slate-800 rounded-2xl text-xs text-slate-400">Нет активных дуэлей. Создай первую!</div>`;
        return;
      }
      c.innerHTML = rooms.map(r => `
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl flex items-center justify-between">
          <div><div class="font-bold text-xs">${r.hostName}</div><div class="text-[11px] text-amber-400">Ставка: ${r.bet} 🪙</div></div>
          <button onclick="joinRoom('${r.id}', ${r.bet})" class="px-3 py-1.5 bg-emerald-500 text-slate-950 font-black text-xs rounded-xl">В бой</button>
        </div>
      `).join('');
    }

    function joinRoom(roomId, bet) {
      if (myDeck.length !== 15) return alert('Соберите колоду из 15 карт перед дуэлью!');
      if (balance < bet) return alert('Недостаточно монет!');
      currentRoomId = roomId;
      currentBet = bet;
      if (socket?.connected) socket.emit('join_room', { roomId, guestName: playerName, deck: myDeck });
    }

    function renderWaitingState() {
      document.getElementById('roomList').innerHTML = `
        <div class="bg-slate-900 border border-amber-500/30 p-5 rounded-2xl text-center space-y-2">
          <div class="animate-spin text-xl">⏳</div>
          <div class="font-bold text-xs text-amber-400">Комната создана! Ждем соперника...</div>
          <button onclick="cancelRoom()" class="px-3 py-1 bg-slate-800 rounded-lg text-[11px] text-red-400">Отмена</button>
        </div>`;
    }

    function cancelRoom() {
      if (socket && currentRoomId) {
        socket.emit('leave_room', { roomId: currentRoomId });
        currentRoomId = null;
        socket.emit('get_lobby');
      }
    }

    function refreshLobby() { if (socket?.connected) socket.emit('get_lobby'); }

    // --- БОЕВОЙ СТОЛ (HEARTHSTONE) ---
    function handleServerSync(state) {
      gameState = state;
      document.getElementById('battleArena').classList.remove('hidden');

      // Обновляем данные оппонента
      document.getElementById('battleOppName').innerText = state.opp.name;
      document.getElementById('oppHpBadge').innerText = state.opp.hp;
      document.getElementById('oppManaText').innerText = `${state.opp.currentMana}/${state.opp.maxMana}`;
      document.getElementById('oppHandCount').innerText = state.opp.hand;

      // Обновляем данные игрока
      document.getElementById('myBattleName').innerText = state.me.name;
      document.getElementById('myHpBadge').innerText = state.me.hp;
      document.getElementById('myManaText').innerText = `${state.me.currentMana}/${state.me.maxMana}`;

      // Кнопка хода
      const endBtn = document.getElementById('endTurnBtn');
      endBtn.disabled = !state.isMyTurn;
      endBtn.className = state.isMyTurn 
        ? "px-5 py-2.5 bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-black text-xs rounded-xl shadow-lg active:scale-95"
        : "px-5 py-2.5 bg-slate-800 text-slate-500 font-bold text-xs rounded-xl cursor-not-allowed";

      renderBoard(state.opp.board, 'oppBoard', false);
      renderBoard(state.me.board, 'myBoard', true);
      renderBattleHand(state.me.hand);
    }

    function renderBoard(minions, containerId, isMine) {
      const c = document.getElementById(containerId);
      c.innerHTML = minions.map(m => {
        const isSel = selectedBoardMinion === m.uid;
        const canAtk = isMine && gameState?.isMyTurn && m.canAttack;
        return `
          <div onclick="${isMine ? `selectBoardMinion('${m.uid}')` : `targetOppMinion('${m.uid}')`}" 
               class="w-16 h-22 rounded-xl border-2 ${m.taunt ? 'card-taunt' : 'border-slate-700'} ${canAtk ? 'glow-green' : ''} ${isSel ? 'glow-yellow' : ''} bg-slate-900 p-1 flex flex-col justify-between relative cursor-pointer active:scale-95 transition">
            <span class="text-xl text-center">${m.icon}</span>
            <span class="text-[9px] font-bold text-center truncate">${m.name}</span>
            <div class="flex justify-between text-[11px] font-black">
              <span class="text-amber-400">${m.atk}</span>
              <span class="text-red-400">${m.hp}</span>
            </div>
            ${m.taunt ? `<div class="absolute -top-1.5 -right-1 text-[10px]">🛡️</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function renderBattleHand(hand) {
      const c = document.getElementById('myHand');
      c.innerHTML = hand.map(card => {
        const canPlay = gameState?.isMyTurn && gameState.me.currentMana >= card.mana;
        const isSel = selectedHandCard?.uid === card.uid;
        return `
          <div onclick="selectHandCard('${card.uid}')" 
               class="w-16 h-24 rounded-xl border ${isSel ? 'border-amber-400 scale-105' : 'border-slate-700'} ${canPlay ? 'border-emerald-500/80 bg-slate-900' : 'bg-slate-950 opacity-60'} p-1.5 flex flex-col justify-between flex-shrink-0 cursor-pointer active:scale-95 transition">
            <div class="flex justify-between items-center">
              <span class="w-4 h-4 rounded-full bg-cyan-600 text-white font-black text-[9px] flex items-center justify-center">${card.mana}</span>
              <span class="text-base">${card.icon}</span>
            </div>
            <span class="text-[9px] font-bold text-center leading-tight truncate">${card.name}</span>
            ${card.type === 'minion' ? `
              <div class="flex justify-between text-[10px] font-black">
                <span class="text-amber-400">${card.atk}</span>
                <span class="text-red-400">${card.hp}</span>
              </div>` : `
              <div class="text-[8px] text-center font-bold text-indigo-400">Закл</div>`
            }
          </div>
        `;
      }).join('');
    }

    function selectHandCard(uid) {
      if (!gameState?.isMyTurn) return;
      const card = gameState.me.hand.find(c => c.uid === uid);
      if (!card || gameState.me.currentMana < card.mana) return;

      selectedHandCard = card;
      selectedBoardMinion = null;

      // Если это существо без таргета — сразу выставляем на стол
      if (card.type === 'minion') {
        socket.emit('play_card', { roomId: currentRoomId, cardUid: card.uid });
        selectedHandCard = null;
      }
    }

    function selectBoardMinion(uid) {
      if (!gameState?.isMyTurn) return;
      const m = gameState.me.board.find(x => x.uid === uid);
      if (m && m.canAttack) {
        selectedBoardMinion = uid;
        selectedHandCard = null;
        renderBoard(gameState.me.board, 'myBoard', true);
      }
    }

    function targetOppHero() {
      if (!gameState?.isMyTurn) return;
      if (selectedBoardMinion) {
        socket.emit('attack', { roomId: currentRoomId, attackerUid: selectedBoardMinion, targetId: 'opp_hero' });
        selectedBoardMinion = null;
      } else if (selectedHandCard && selectedHandCard.type === 'spell') {
        socket.emit('play_card', { roomId: currentRoomId, cardUid: selectedHandCard.uid, targetId: 'opp_hero' });
        selectedHandCard = null;
      }
    }

    function targetOppMinion(uid) {
      if (!gameState?.isMyTurn) return;
      if (selectedBoardMinion) {
        socket.emit('attack', { roomId: currentRoomId, attackerUid: selectedBoardMinion, targetId: uid });
        selectedBoardMinion = null;
      } else if (selectedHandCard && selectedHandCard.type === 'spell') {
        socket.emit('play_card', { roomId: currentRoomId, cardUid: selectedHandCard.uid, targetId: uid });
        selectedHandCard = null;
      }
    }

    function targetMyHero() {
      if (selectedHandCard && selectedHandCard.type === 'spell' && selectedHandCard.heal) {
        socket.emit('play_card', { roomId: currentRoomId, cardUid: selectedHandCard.uid, targetId: 'my_hero' });
        selectedHandCard = null;
      }
    }

    function endTurn() {
      if (gameState?.isMyTurn && socket) {
        socket.emit('end_turn', { roomId: currentRoomId });
      }
    }

    function handleGameOver(res) {
      const isWin = res.winner === socket.id;
      const prize = Math.floor(currentBet * 2 * 0.9);
      if (isWin) {
        balance += prize;
        alert(`🏆 ПОБЕДА! Вы уничтожили героя соперника и выиграли ${prize} монет!`);
      } else {
        balance -= currentBet;
        alert(`💀 ПОРАЖЕНИЕ! Ваш герой пал.`);
      }
      updateBalanceDisplay();
      document.getElementById('battleArena').classList.add('hidden');
      refreshLobby();
    }
  </script>
</body>
</html>
